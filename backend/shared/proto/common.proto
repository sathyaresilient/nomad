syntax = "proto3";

package nomadly.common;

option go_package = "github.com/nomadly/backend/shared/proto/common";

// Common timestamp message
message Timestamp {
  int64 seconds = 1;
  int32 nanos = 2;
}

// Pagination request
message PaginationRequest {
  int32 limit = 1;
  int32 offset = 2;
}

// Pagination response metadata
message PaginationResponse {
  int32 total = 1;
  int32 limit = 2;
  int32 offset = 3;
  bool has_more = 4;
}

// Standard error response
message Error {
  string code = 1;
  string message = 2;
  map<string, string> details = 3;
}

// Empty message for void returns
message Empty {}

// Standard ID request
message IdRequest {
  string id = 1;
}

// Standard ID response
message IdResponse {
  string id = 1;
}

// Health check
message HealthCheckRequest {
  string service = 1;
}

message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
  }
  ServingStatus status = 1;
}

service Health {
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);
}
