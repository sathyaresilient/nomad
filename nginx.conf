server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Include default MIME types + add font types
    include /etc/nginx/mime.types;
    types {
        font/ttf ttf;
        font/woff woff;
        font/woff2 woff2;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript font/ttf font/woff font/woff2;

    # Static assets - serve directly with CORS for fonts
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    location /_expo/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # Cache other static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # SPA routing - serve index.html for all other routes
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
