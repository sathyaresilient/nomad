# =================================================================
# Nomadly Backend CI/CD Pipeline
# Deploys API Gateway to GCP Cloud Run
# =================================================================

name: Backend CI/CD

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "backend/**"

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  GAR_LOCATION: us-central1
  REPOSITORY: nomadly-images
  SERVICE: nomadly-api-gateway

jobs:
  # =================================================================
  # Lint & Test
  # =================================================================
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install API Gateway dependencies
        run: npm ci
        working-directory: backend/services/api-gateway

      - name: Lint
        run: npm run lint

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: backend/services/api-gateway

      - name: Run Tests
        run: npm test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

  # =================================================================
  # Build Docker Image
  # =================================================================
  build:
    name: Build Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    outputs:
      image: ${{ steps.build.outputs.image }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

      - name: Build and Push Docker Image
        id: build
        run: |
          IMAGE="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}"
          docker build -t $IMAGE backend/services/api-gateway
          docker push $IMAGE
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

  # =================================================================
  # Deploy to Development
  # =================================================================
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: nomadly-dev-api-gateway
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}

      - name: Post Deploy Health Check
        run: |
          URL=$(gcloud run services describe nomadly-dev-api-gateway --region=${{ env.GCP_REGION }} --format='value(status.url)')
          echo "Service URL: $URL"
          curl -f $URL/health || exit 1

  # =================================================================
  # Deploy to Production
  # =================================================================
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: nomadly-prod-api-gateway
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}
          env_vars: |
            NODE_ENV=production
            DATABASE_URL=${{ secrets.DATABASE_URL }}
          flags: |
            --min-instances=0
            --max-instances=10
            --cpu=1
            --memory=512Mi
            --allow-unauthenticated

      - name: Post Deploy Health Check
        run: |
          URL=$(gcloud run services describe nomadly-prod-api-gateway --region=${{ env.GCP_REGION }} --format='value(status.url)')
          echo "Service URL: $URL"
          curl -f $URL/health || exit 1

  # =================================================================
  # Terraform Plan (for infrastructure changes)
  # =================================================================
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    defaults:
      run:
        working-directory: backend/infrastructure/terraform

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        id: plan
        run: terraform plan -var-file=environments/dev.tfvars -no-color
        env:
          TF_VAR_db_password: ${{ secrets.DEV_DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.DEV_JWT_SECRET }}
          TF_VAR_google_oauth_client_id: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          TF_VAR_google_oauth_client_secret: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          TF_VAR_apple_oauth_client_id: ${{ secrets.APPLE_OAUTH_CLIENT_ID }}
          TF_VAR_apple_oauth_team_id: ${{ secrets.APPLE_OAUTH_TEAM_ID }}
          TF_VAR_apple_oauth_key_id: ${{ secrets.APPLE_OAUTH_KEY_ID }}
          TF_VAR_apple_oauth_private_key: ${{ secrets.APPLE_OAUTH_PRIVATE_KEY }}
        continue-on-error: true

      - name: Comment Plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan 📖

            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`

            *Pushed by: @${{ github.actor }}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });
